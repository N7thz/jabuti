name: Carga de dados

on:
  schedule:
    - cron: "0 6 * * *" # diária: Câmara, Senado e emendas do ano corrente
    - cron: "0 9 * * 0" # semanal (domingo): municípios e TSE, depois da diária
  workflow_dispatch:
    inputs:
      fonte:
        description: Fonte a carregar
        type: choice
        default: diaria
        options:
          - diaria
          - semanal
          - camara
          - senado
          - emendas
          - municipios
          - tse
          - eleitos
          - notificar
      argumentos:
        description: "Argumentos extras do script, ex.: --anos 2020-2025 (só com uma fonte escolhida)"
        type: string
        required: false

env:
  DATABASE_URL: ${{ secrets.DATABASE_URL }}
  DIRECT_URL: ${{ secrets.DIRECT_URL }}
  PORTAL_TRANSPARENCIA_API_KEY: ${{ secrets.PORTAL_TRANSPARENCIA_API_KEY }}
  ARGUMENTOS: ${{ inputs.argumentos }}
  # Endereço do portal para renovar o cache depois de cada carga (variável do repositório; vazia, vale o domínio).
  SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL || 'https://portal-jabuti.com.br' }}

jobs:
  camara:
    if: github.event.schedule == '0 6 * * *' || contains(fromJSON('["diaria","camara"]'), inputs.fonte)
    runs-on: ubuntu-latest
    timeout-minutes: 120
    # Uma carga por fonte de cada vez; a seguinte espera a atual terminar.
    concurrency: { group: sync-camara, cancel-in-progress: false }
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with: { bun-version-file: package.json }
      - run: bun install --frozen-lockfile
      - run: bun scripts/sync-camara.ts $ARGUMENTOS
      # Só roda se a carga deu certo: renova o cache das páginas que leem o que ela gravou.
      - uses: ./.github/actions/revalidar
        with: { fonte: camara, segredo: "${{ secrets.REVALIDAR_SEGREDO }}", site: "${{ env.SITE_URL }}" }

  senado:
    if: github.event.schedule == '0 6 * * *' || contains(fromJSON('["diaria","senado"]'), inputs.fonte)
    runs-on: ubuntu-latest
    timeout-minutes: 120
    concurrency: { group: sync-senado, cancel-in-progress: false }
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with: { bun-version-file: package.json }
      - run: bun install --frozen-lockfile
      - run: bun scripts/sync-senado.ts $ARGUMENTOS
      - uses: ./.github/actions/revalidar
        with: { fonte: senado, segredo: "${{ secrets.REVALIDAR_SEGREDO }}", site: "${{ env.SITE_URL }}" }

  emendas:
    if: github.event.schedule == '0 6 * * *' || contains(fromJSON('["diaria","emendas"]'), inputs.fonte)
    runs-on: ubuntu-latest
    timeout-minutes: 180
    concurrency: { group: sync-emendas, cancel-in-progress: false }
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with: { bun-version-file: package.json }
      - run: bun install --frozen-lockfile
      # Sem argumentos, carrega o ano corrente.
      - run: bun scripts/sync-emendas.ts $ARGUMENTOS
      - uses: ./.github/actions/revalidar
        with: { fonte: emendas, segredo: "${{ secrets.REVALIDAR_SEGREDO }}", site: "${{ env.SITE_URL }}" }

  municipios:
    if: github.event.schedule == '0 9 * * 0' || contains(fromJSON('["semanal","municipios"]'), inputs.fonte)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    concurrency: { group: sync-municipios, cancel-in-progress: false }
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with: { bun-version-file: package.json }
      - run: bun install --frozen-lockfile
      - run: bun scripts/sync-municipios.ts
      - uses: ./.github/actions/revalidar
        with: { fonte: municipios, segredo: "${{ secrets.REVALIDAR_SEGREDO }}", site: "${{ env.SITE_URL }}" }

  tse:
    if: github.event.schedule == '0 9 * * 0' || contains(fromJSON('["semanal","tse","eleitos"]'), inputs.fonte)
    runs-on: ubuntu-latest
    timeout-minutes: 240
    concurrency: { group: sync-tse, cancel-in-progress: false }
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with: { bun-version-file: package.json }
      - run: bun install --frozen-lockfile
      - name: TSE dos parlamentares em exercício
        if: inputs.fonte != 'eleitos'
        run: bun scripts/sync-tse.ts $ARGUMENTOS
      # Eleitos da última eleição geral (inclui quem ainda não é parlamentar); o TSE corrige o resultado por semanas.
      - name: Eleitos
        if: inputs.fonte != 'tse'
        run: bun scripts/sync-eleitos.ts ${{ inputs.fonte == 'eleitos' && '$ARGUMENTOS' || '' }}
      - uses: ./.github/actions/revalidar
        with: { fonte: tse, segredo: "${{ secrets.REVALIDAR_SEGREDO }}", site: "${{ env.SITE_URL }}" }

  # Depois da carga da Câmara e do Senado: votos e projetos novos de quem é seguido viram notificações,
  # a situação dos projetos seguidos é conferida na API, e saem os resumos por email que estão na hora.
  notificar:
    needs: [camara, senado]
    # Roda mesmo se uma das cargas falhar (a outra pode ter trazido novidades); não roda se foram puladas à mão.
    if: >-
      !cancelled() && (github.event.schedule == '0 6 * * *' || contains(fromJSON('["diaria","notificar"]'), inputs.fonte))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency: { group: notificar, cancel-in-progress: false }
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with: { bun-version-file: package.json }
      - run: bun install --frozen-lockfile
      - run: bun scripts/notificar.ts
